name: moonlite
description: "MOONLITE – Moon Phase Tracker & Lunar Calendar. A premium astronomy mobile application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.6.6
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.2
  geolocator: ^13.0.1
  sensors_plus: ^6.1.0
  camera: ^0.11.0+2
  intl: ^0.19.0
  permission_handler: ^11.3.1
  lottie: ^3.1.3
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/animations/
